[project]
name = "pku-auto-elective-cli"
version = "0.1.0"
description = "Cross-platform, terminal-only PKU elective helper"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5,<7",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "pillow>=10,<13",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.scripts]
pku-elective = "pku_elective_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pku_elective_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
